name: Test formula
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  linuxbrew:
    runs-on: ubuntu-latest
    steps:
      - name: Install via Linuxbrew (tests formula syntax + Linux binary + checksum)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install scalixworld/tap/scalix-cloud
          scalix-cloud --version | grep -F "1.3.4"
